# ============================================================
# 1行日記サイト — ローカル開発スタック
#   web (nginx) : http://localhost:8081
#   app (php-fpm 8.5) : Laravel 実行環境。composer / artisan はこのコンテナで実行
#   db  (MySQL 26.7.0) : localhost:3327 (user: diary / pass: secret)
#                         アプリ用 DB: diary / テスト用 DB: diary_test
# 起動: docker compose up -d --build
#
# ここに書いてある認証情報はローカル開発専用です。公開環境では使わないでください。
# ホストの uid/gid が 1000 以外の Linux では、プロジェクト直下の .env に UID=xxxx / GID=xxxx を
# 書くと app コンテナがその ID で動きます (compose は .env を変数展開に使います)。
# ============================================================
name: hana_prime_diary_test

services:
  web:
    image: nginx:1-alpine
    container_name: hana_prime_diary_test_web
    ports:
      - "8081:80"
    volumes:
      # public/ だけでなくツリー全体を app と同じパスにマウントする。
      # storage:link が作る public/storage は /var/www/html/storage/app/public を指す絶対パスの
      # シンボリックリンクなので、同じパス構成でないとアップロード画像が 404 になる。
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

  app:
    build:
      context: ./docker/php
      args:
        # シェルの $UID は export されていないので、未指定なら 1000 になる (上のコメント参照)
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: hana_prime_diary_test_app
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: diary
      DB_USERNAME: diary
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    # 動作確認した 26.7.0 (Innovation 系列) にパッチまで固定する。PHP と同じ粒度
    image: mysql:26.7.0
    container_name: hana_prime_diary_test_db
    environment:
      # ローカル開発専用の固定パスワード
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: diary
      MYSQL_USER: diary
      MYSQL_PASSWORD: secret
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3327:3306"
    volumes:
      - db_data:/var/lib/mysql
      # 初期化 SQL はボリューム初回作成時にだけ実行される (docker/mysql/init 参照)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

volumes:
  db_data:
    name: hana_prime_diary_test_db_data

networks:
  internal:
    name: hana_prime_diary_test_internal
    driver: bridge
