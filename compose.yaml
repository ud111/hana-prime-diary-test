# ============================================================
# 1行日記サイト — ローカル開発スタック
#   web (nginx) : http://localhost:8081
#   app (php-fpm 8.5) : Laravel 実行環境。composer / artisan はこのコンテナで実行
#   db  (MySQL 26.7) : localhost:3327 (user: diary / pass: secret)
#                       アプリ用 DB: diary / テスト用 DB: diary_test
# 起動: docker compose up -d --build
# ============================================================
name: hana_prime_diary_test

services:
  web:
    image: nginx:1-alpine
    container_name: hana_prime_diary_test_web
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal
    restart: unless-stopped

  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: hana_prime_diary_test_app
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: diary
      DB_USERNAME: diary
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  db:
    image: mysql:26.7
    container_name: hana_prime_diary_test_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: diary
      MYSQL_USER: diary
      MYSQL_PASSWORD: secret
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3327:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal
    restart: unless-stopped

volumes:
  db_data:
    name: hana_prime_diary_test_db_data

networks:
  internal:
    name: hana_prime_diary_test_internal
    driver: bridge
