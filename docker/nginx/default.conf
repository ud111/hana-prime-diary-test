server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;

    # 存在しないパスの 404 も Laravel 側で描画する (公式ドキュメントの nginx 例に準拠)
    error_page 404 /index.php;

    # テキスト系は gzip で送る
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
    gzip_min_length 1024;

    # 画像と CSS は 7 日キャッシュ。CSS は URL に更新時刻を付けているので差し替え時も古いものが残らない
    location ~* \.(css|js|jpg|jpeg|png|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # robots.txt は Laravel のルートで動的に返すため、ここでは扱わない (静的前提のブロックを置くと 404 になる)
    location = /favicon.ico { access_log off; log_not_found off; }   # 古いブラウザ向けの要求はログに残さない (実体は favicon.svg)

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
